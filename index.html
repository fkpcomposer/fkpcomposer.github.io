<!DOCTYPE html>
<html>
<head>
	<title>FKPC</title>
    
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Urbanist:ital@0;1&display=swap" rel="stylesheet">
</head>
<style>

	body{
		text-align: center;
        background-color: black;
        padding: 20px;
        font-family: "Urbanist", sans-serif;
	}
    
    .first-thing{
    	background-image: url("images/first-thing-bg.png");
        background-position: center;
        background-size: cover;
        
        border-radius: 10px;
        padding: 50px;
    }
    
    .discography{
    	background-image: url("images/discography-bg.png");
        background-position: center;
        background-size: cover;
        
        border-radius: 10px;
        padding: 50px;
        
        color: white;
    }
    
    .song-scroll{
        display: grid;
        grid-auto-flow: column;
        gap: 5px;
        overflow-x: auto;
        overflow-y: hidden;
        margin-bottom: 20px;
    }
    
    .song-scroll img {
        height: 300px;
        border-radius: 10px;
    }

    ::-webkit-scrollbar{
    	display: none;
    }

    hr {
      height: 2px;
      background-color: white;
    }
    
</style>
<body>

	<div class="first-thing">
		<img src="images/logo.svg" width=500>
		<p>I'm 14 and I don't know what to do with my life :3<br><a href="https://fkpc.newgrounds.com">Newgrounds</a> // <a href="https://soundcloud.com/fkpcmusic">SoundCloud</a> // <a href="https://youtube.com/@FKPCmusic">Youtube</a></p>
		<img src="images/synth-pose.png" width=200>
	</div>
    <hr>
    <div class="discography">
		<h1 style="margin-bottom:0px;">Discography</h1>
        <p style="margin-top:5px;">I put notes in a grid until it sounds nice! I've listed some of my best music below.</p>
        <hr style="height:1px;">
        <div class="song-scroll" id="songscroll">
        </div>
		<audio controls style="display:none;" id="playeraudio">
        <source src="horse.mp3" type="audio/mpeg">
    </audio>
    <p id="playername" style="margin-bottom:5px;">Click on a track to hear a preview!</p>
    <p id="playerlinks" style="margin-top:0px;opacity:0.5;font-size:13px;">Links will appear here...</p>
	</div>


</body>
<script>
let releases = [
  {
    name: "Mulberry Shrine",
    cover: "song_scroll/mulberry-shrine.jpg",
    audiolink: "song_scroll/mulberry-shrine.mp3"
  },
  {
    name: "Midnight in Scratchtown (Original Soundtrack)",
    cover: "song_scroll/mis-ost.png",
    audiolink: "song_scroll/midnight-in-scratchtown.mp3"
  },
  {
    name: "Acrobatics",
    cover: "song_scroll/acrobatics.png",
    audiolink: "song_scroll/acrobatics.mp3"
  },
  {
    name: "Siga A Estrada",
    cover: "song_scroll/siga-a-estrada.png",
    audiolink: "song_scroll/siga-a-estrada.mp3"
  },
  {
    name: "Outer Signal",
    cover: "song_scroll/outer-signal.png",
    audiolink: "song_scroll/outer-signal.mp3"
  },
  {
    name: "Nostalgic Seashore",
    cover: "song_scroll/nostalgic-seashore.png",
    audiolink: "song_scroll/nostalgic-seashore.mp3"
  }
];

for (let i = 0; i < releases.length; i++){
let img = new Image();
img.src = releases[i].cover;
img.height = 300;
img.onclick = () => {changePlayerSong(releases[i].name, releases[i].audiolink)}
document.getElementById("songscroll").appendChild(img);
}

function changePlayerSong(name, audiolink) {
    document.getElementById("playername").innerHTML = name;
    document.getElementById("playeraudio").src = audiolink;
	document.getElementById("playeraudio").play();
}
</script>
</html>
