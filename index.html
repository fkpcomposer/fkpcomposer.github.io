<!DOCTYPE html>
<html>
<head>
	<title>FKPC</title>
    
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Urbanist:ital@0;1&display=swap" rel="stylesheet">

<style>

	body{
		text-align: center;
        background-color: black;
        padding: 20px;
        font-family: "Urbanist", sans-serif;
	}
    
    .first-thing{
    	background-image: url("https://github.com/fkpcomposer/fkpcomposer.github.io/blob/main/images/first-thing-bg.png?raw=true");
        background-position: center;
        background-size: cover;
        
        border-radius: 10px;
        padding: 50px;
    }
    
    .discography{
    	background-image: url("https://github.com/fkpcomposer/fkpcomposer.github.io/blob/main/images/discography-bg.png?raw=true");
        background-position: center;
        background-size: cover;
        
        border-radius: 10px;
        padding: 50px;
        
        color: white;
    }
    
    .song-scroll{
        display: grid;
        grid-auto-flow: column;
        gap: 5px;
        overflow-x: auto;
        overflow-y: hidden;
    }
    
        .song-scroll img {
    	height: 300px;
        border-radius: 10px;
    }
    
    ::-webkit-scrollbar{
    	display: none;
    }
    
</style>

	</div>
