<!DOCTYPE html>
<html>
<head>
	<title>FKPC</title>
    
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Urbanist:ital@0;1&display=swap" rel="stylesheet">
</head>
<style>

	body{
		text-align: center;
        background-color: black;
        padding: 20px;
        font-family: "Urbanist", sans-serif;
	}
    
    .first-thing{
    	background-image: url("images/first-thing-bg.png");
        background-position: center;
        background-size: cover;
        
        border-radius: 10px;
        padding: 50px;
		margin-bottom: 10px;
    }
    
    .discography{
    	background-image: url("images/discography-bg.png");
        background-position: center;
        background-size: cover;
        
        border-radius: 10px;
        padding: 50px;
        
        color: white;
    }

	a:link,
	a:visited,
	a {
		color: #FE0267;
	}
    
    .song-scroll{
        display: grid;
        grid-auto-flow: column;
        gap: 5px;
        overflow-x: auto;
        overflow-y: hidden;
        margin-bottom: 20px;
    }
    
    .song-scroll img {
        height: 300px;
        border-radius: 10px;
    }

    ::-webkit-scrollbar{
    	display: none;
    }
    
</style>
<body>

	<div class="first-thing">
		<img src="images/logo.svg" width=500>
		<p>I'm 14 and I don't know what to do with my life :3<br><a href="https://fkpc.newgrounds.com">Newgrounds</a> // <a href="https://soundcloud.com/fkpcmusic">SoundCloud</a> // <a href="https://youtube.com/@FKPCmusic">Youtube</a></p>
		<img src="images/synth-pose.png" width=200>
	</div>
    <div class="discography">
		<h1 style="margin-bottom:0px;">Discography</h1>
        <p style="margin-top:5px;">I put notes in a grid until it sounds nice! I've listed some of my best music below.</p>
        <hr height=1>
        <div class="song-scroll" id="songscroll">
        </div>
		<audio controls style="display:none;" id="playeraudio">
        <source src="horse.mp3" type="audio/mpeg">
    </audio>
    <p id="playername" style="margin-bottom:5px;">Click on a track to hear a preview!</p>
    <p id="playermoretext" style="margin-top:0px;opacity:0.5;font-size:13px;">Links will appear here...</p>
	</div>

</body>
<script>
let releases = [
  {
    name: "Mulberry Shrine",
    cover: "https://raw.githubusercontent.com/fkpcomposer/fkpcomposer.github.io/refs/heads/main/song_scroll/mulberry-shrine.jpg",
    audiolink: "song_scroll/mulberry-shrine.mp3",
	alt: "A heavily edited photograph of a mulberry tree.",
	moretext: '<a href="https://www.newgrounds.com/audio/listen/1616799">Newgrounds</a> // <a href="https://soundcloud.com/fkpcmusic/mulberry-shrine">SoundCloud</a> // <a href="https://www.youtube.com/watch?v=aljmYLrimdo">YouTube</a>'
  },
  {
    name: "Midnight in Scratchtown (Original Soundtrack)",
    cover: "song_scroll/mis-ost.png",
    audiolink: "song_scroll/midnight-in-scratchtown.mp3",
	alt: "A hand-made drawing of a ghost wandering around a town haunted by other ghosts.",
	moretext: 'Soundtrack for the game <a href="https://scratch.mit.edu/projects/1397189785/">"Midnight in Scratchtown"</a><br><a href="https://www.newgrounds.com/album/571450/midnight-in-scratchtown-ost">Newgrounds</a> // <a href="https://soundcloud.com/fkpcmusic/sets/mis-soundtrack">SoundCloud</a> // <a href="https://www.youtube.com/playlist?list=PLf5a8BxzurXA">YouTube</a>'
  },
  {
    name: "Acrobatics",
    cover: "song_scroll/acrobatics.png",
    audiolink: "song_scroll/acrobatics.mp3",
	alt: "A vector drawing about a black circle with legs running desperately from colorful geometrical shapes.",
	moretext: '<a href="https://tinyurl.com/mis-ost">Newgrounds</a> // <a href="https://soundcloud.com/fkpcmusic/mulberry-shrine">SoundCloud</a> // <a href="https://www.youtube.com/watch?v=aljmYLrimdo">YouTube</a>'
  },
  {
    name: "Siga A Estrada",
    cover: "song_scroll/siga-a-estrada.png",
    audiolink: "song_scroll/siga-a-estrada.mp3",
	alt: "A turtle with wheels and a race-car-themed shell wearing googles. The turtle runs on a street and there is an island with multiple different areas visible in the background.",
	moretext: '<a href="https://www.newgrounds.com/audio/listen/1616799">Newgrounds</a> // <a href="https://soundcloud.com/fkpcmusic/mulberry-shrine">SoundCloud</a> // <a href="https://www.youtube.com/watch?v=aljmYLrimdo">YouTube</a>'
  },
  {
    name: "Outer Signal",
    cover: "song_scroll/outer-signal.png",
    audiolink: "song_scroll/outer-signal.mp3",
	alt: "None yet.",
	moretext: '<a href="https://www.newgrounds.com/audio/listen/1616799">Newgrounds</a> // <a href="https://soundcloud.com/fkpcmusic/mulberry-shrine">SoundCloud</a> // <a href="https://www.youtube.com/watch?v=aljmYLrimdo">YouTube</a>'
  },
  {
    name: "Nostalgic Seashore (Remastered)",
    cover: "song_scroll/nostalgic-seashore.png",
    audiolink: "song_scroll/nostalgic-seashore.mp3",
	alt: "A hand-made drawing without outlines showing water and a bright glowing sun in the background.",
	moretext: '<a href="https://www.newgrounds.com/audio/listen/1616799">Newgrounds</a> // <a href="https://soundcloud.com/fkpcmusic/mulberry-shrine">SoundCloud</a> // <a href="https://www.youtube.com/watch?v=aljmYLrimdo">YouTube</a>'
  }
];

for (let i = 0; i < releases.length; i++){
let img = new Image();
img.src = releases[i].cover;
img.alt = releases[i].alt
img.title = releases[i].name
img.onclick = () => {changePlayerSong(releases[i].name, releases[i].moretext, releases[i].audiolink)}
document.getElementById("songscroll").appendChild(img);
}

function changePlayerSong(name, links, audiolink) {
    document.getElementById("playername").innerHTML = name;
	document.getElementById("playermoretext").innerHTML = links
    document.getElementById("playeraudio").src = audiolink;
	document.getElementById("playeraudio").play();
}
</script>
</html>
